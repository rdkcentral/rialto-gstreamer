name: Native Build

on:
  pull_request:
    branches: ["master", "release/*"]
  push:
    branches: ["master", "release/*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          path: rialto-gstreamer

      # Check, from which rialto branch should we download headers
      - name: Check if rialto branch with the same name exists
        id: check-branch
        shell: bash
        run: |
          # Default to master for security
          branch="master"
          
          # For push events, check if branch exists in official rialto repo
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            current_branch="${{ github.ref_name }}"
            
            # Verify branch exists in official rdkcentral/rialto repository
            if git ls-remote --exit-code --heads "https://github.com/rdkcentral/rialto.git" "refs/heads/$current_branch" > /dev/null 2>&1; then
              branch="$current_branch"
              echo "✓ Found matching branch '$current_branch' in official rialto repo"
            else
              echo "⚠ Branch '$current_branch' not found in rialto repo, using master"
            fi
          fi
          
          # For pull requests, try to find matching branch in official repo
          # Priority: PR head branch name (if exists in official repo) > base branch > master
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            head_ref="${{ github.event.pull_request.head.ref }}"
            base_ref="${{ github.event.pull_request.base.ref }}"
            
            # Try PR head branch name (but only if it exists in OFFICIAL rdkcentral/rialto repo)
            # This is safe because we verify it exists in the official repo, not the fork
            if git ls-remote --exit-code --heads "https://github.com/rdkcentral/rialto.git" "refs/heads/$head_ref" > /dev/null 2>&1; then
              branch="$head_ref"
              echo "✓ Using PR head branch '$head_ref' from official rialto repo"
            # Try base branch
            elif git ls-remote --exit-code --heads "https://github.com/rdkcentral/rialto.git" "refs/heads/$base_ref" > /dev/null 2>&1; then
              branch="$base_ref"
              echo "✓ Using PR base branch '$base_ref' from official rialto repo"
            else
              # Fall back to master
              echo "⚠ Neither head nor base branch found in rialto repo, using master"
            fi
          fi
          
          echo "Using rialto branch: $branch"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      # Checkout rialto repository for header fallback (using validated branch only)
      - name: checkout rialto repo (for header dependencies)
        uses: actions/checkout@v4
        with:
          repository: rdkcentral/rialto
          path: rialto-gstreamer/rialto
          ref: ${{ steps.check-branch.outputs.branch }}

      - name: Install Dependencies
        run: |
          WORK_DIR=$(pwd)

          echo "Using branch: ${{ steps.check-branch.outputs.branch }}"
          echo "Work dir: ${WORK_DIR}"

          cd rialto-gstreamer
          sudo sh -x -v install_dependencies_for_native_build.sh "${{ steps.check-branch.outputs.branch }}" "${WORK_DIR}" &> "${WORK_DIR}/output_file.txt"

      - name: Native build Rialto gstreamer
        run: |
          WORK_DIR=$(pwd)
          cd rialto-gstreamer
          sh -x -v build_native.sh "${WORK_DIR}" &>> "${WORK_DIR}/output_file.txt"

      - name: Report Build Status Success
        if: success()
        run: |
          echo "Build Succeeded!"
          exit 0

      - name: Upload Logs on Failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: Output Logs
          path: |
            output_file.txt
