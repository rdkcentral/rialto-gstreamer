name: Native Build

on:
  pull_request:
    branches: ["master", "release/*"]
  push:
    branches: ["master", "release/*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          path: rialto-gstreamer

      - name: Resolve 8.4 dependency pins
        if: (github.base_ref || github.ref_name) == 'release/v0.14.0'
        run: python3 rialto-gstreamer/scripts/resolve_8_4_pins.py

      - name: Check out rialto
        uses: actions/checkout@v4
        with:
          repository: rdkcentral/rialto
          ref: ${{ env.RIALTO_REF }}
          path: ./rialto
          fetch-depth: 0

      - name: Select Rialto branch
        if: env.RIALTO_REF == ''
        env:
          PR_BRANCH: ${{ github.head_ref }}
          BASE_BRANCH: ${{ github.base_ref || github.ref_name }}
        run: |
          cd rialto
          for candidate in "$PR_BRANCH" "$BASE_BRANCH"; do
            if [ -n "$candidate" ] && git show-ref --verify --quiet "refs/remotes/origin/$candidate"; then
              echo "Using Rialto branch: $candidate"
              git checkout --detach "refs/remotes/origin/$candidate"
              exit 0
            fi
          done
          echo "No matching Rialto branch for source '$PR_BRANCH' or target '$BASE_BRANCH'. Configure a compatible Rialto ref for this release." >&2
          exit 1

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install build-essential
          sudo apt-get install cmake
          sudo apt-get install libunwind-dev libgstreamer-plugins-base1.0-dev libgstreamer-plugins-bad1.0-dev libgstreamer1.0-dev libyaml-cpp-dev

      - name: Install protobuf
        run: |
          sudo apt-get install protobuf-compiler

      - name: Native build Rialto
        run: |
          BASE_DIR=$(pwd)
          NATIVE_DIR=$BASE_DIR/native
          echo "NATIVE_DIR=$NATIVE_DIR" &> $BASE_DIR/output_file.txt
          ls  &>> $BASE_DIR/output_file.txt
          cd rialto
          cmake . -B build  -DCMAKE_INSTALL_PREFIX=$NATIVE_DIR -DNATIVE_BUILD=ON -DRIALTO_BUILD_TYPE="Debug" &>> $BASE_DIR/output_file.txt
          make -C build install &>> $BASE_DIR/output_file.txt

      - name: Native build gstreamer
        run: |
          BASE_DIR=$(pwd)
          NATIVE_DIR=$BASE_DIR/native
          cd rialto-gstreamer
          echo "@@@ GSTREAMER BUILD"  &>> $BASE_DIR/output_file.txt
          cmake . -B build -DCMAKE_INCLUDE_PATH="${NATIVE_DIR}/include"  -DCMAKE_LIBRARY_PATH="${NATIVE_DIR}/lib" -DNATIVE_BUILD=ON -DRIALTO_BUILD_TYPE="Debug" &>> $BASE_DIR/output_file.txt
          make -C build &>> $BASE_DIR/output_file.txt

      - name: Report Build Status Success
        if: success()
        run: |
          echo "Build Succeeded!"
          exit 0

      - name: Upload Logs on Failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: Output Logs
          path: |
            output_file.txt
