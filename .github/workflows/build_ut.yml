# This workflow builds and runs the rialto-gstreamer unittests. The workflow shall fail if any test fails
# and the results of the tests are checked and displayed in github. Logs are uploaded on failure.

name: build_ut

# Controls when the workflow will run
on:
  # Build branch coverage and compare PRs against their target commit.
  push:
    branches: ["master", "release/*", "support/*"]
  pull_request:
    branches: ["master", "release/*", "support/*"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This job sets up the repo with the dependancies then runs the tests
  build-test:
    name: Build and test build_ut

    # Runs on ubuntu
    runs-on: ubuntu-24.04

    # Timeout after
    timeout-minutes: 60

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - name: checkout repo
        uses: actions/checkout@v4

      # Setup github for python 3.8
      - name: setup python
        uses: actions/setup-python@v5
        with:
          python-version: 3.8

      # Setup gstreamer 1.0
      - name: Build gstreamer library
        run: |
          sudo apt-get update
          sudo apt-get install libunwind-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libgstreamer-plugins-bad1.0-dev gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-plugins-ugly gstreamer1.0-libav gstreamer1.0-tools gstreamer1.0-x gstreamer1.0-alsa gstreamer1.0-gl gstreamer1.0-gtk3 gstreamer1.0-qt5 gstreamer1.0-pulseaudio

      # Setup github for lcov 2.0
      - name: Build lcov library
        run: |
          sudo apt-get install libjson-perl libperlio-gzip-perl perl libgd-gd2-perl libcapture-tiny-perl libdatetime-perl
          wget https://github.com/linux-test-project/lcov/releases/download/v2.0/lcov-2.0.tar.gz
          tar -xf lcov-2.0.tar.gz
          cd lcov-2.0
          sudo make install

      - name: Resolve 8.4 dependency pins
        if: (github.base_ref || github.ref_name) == 'release/v0.14.0'
        run: python3 scripts/resolve_8_4_pins.py

      # Check, from which rialto branch should we download headers
      #check whether the PR check points Fails here for Rialto branch
      - name: Check if rialto branch with the same name exists
        if: env.RIALTO_REF == ''
        id: check-branch
        shell: sh +e {0}
        run: |
          branch="${{ github.ref_name }}"
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            git ls-remote --exit-code --heads "https://github.com/rdkcentral/rialto.git" ${{ github.event.pull_request.head.ref }} > /dev/null
            if [ $? -eq 0 ]; then
              branch="${{ github.event.pull_request.head.ref }}"
            else
              git ls-remote --exit-code --heads "https://github.com/rdkcentral/rialto.git" ${{ github.event.pull_request.base.ref}} > /dev/null
              if [ $? -eq 0 ]; then
                branch="${{ github.event.pull_request.base.ref }}"
              else
                branch="master"
              fi
            fi
          fi
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      - name: Pin Rialto dependency revision
        id: pin-rialto
        env:
          SELECTED_REF: ${{ env.RIALTO_REF || steps.check-branch.outputs.branch }}
        run: |
          ref="$SELECTED_REF"
          if ! printf '%s\n' "$ref" | grep -Eq '^[0-9a-f]{40}$'; then
            resolved_ref=$(git ls-remote --exit-code --heads https://github.com/rdkcentral/rialto.git "refs/heads/$ref")
            ref="${resolved_ref%%[[:space:]]*}"
          fi
          if ! printf '%s\n' "$ref" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "Could not resolve the Rialto dependency to a commit SHA" >&2
            exit 1
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      # Run the build script
      - name: build_ut.py script
        env:
          RIALTO_BUILD_REF: ${{ steps.pin-rialto.outputs.ref }}
        run: |
              python build_ut.py -c -xml -f -cov -b "$RIALTO_BUILD_REF"

      # Process the test results
      - name: Check results
        uses: dorny/test-reporter@v1
        if: success() || failure()
        with:
          name: GTests
          path: build/*gtest_result.xml
          reporter: java-junit

      # Upload logs on failure
      - name: Upload logs
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: logs
          path: |
            gtest_result.log
            build/*gtest_result.xml

      # Upload coverage report on success
      - name: Upload Coverage Report
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: coverage_report
          path: build/gh_pages/coverage_report

      # Upload coverage statistics on success
      - name: Upload Coverage Statistics
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: coverage_report_stats
          path: build/coverage_statistics.txt
          if-no-files-found: error

      - name: Checkout target commit for coverage baseline
        if: ${{ github.event_name == 'pull_request' && (startsWith(github.base_ref, 'release/') || startsWith(github.base_ref, 'support/')) }}
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: coverage-baseline
          persist-credentials: false

      - name: Build target commit coverage
        if: ${{ github.event_name == 'pull_request' && (startsWith(github.base_ref, 'release/') || startsWith(github.base_ref, 'support/')) }}
        working-directory: coverage-baseline
        env:
          RIALTO_BUILD_REF: ${{ steps.pin-rialto.outputs.ref }}
        run: |
          # Historical baseline CMake does not read RIALTO_OCDM_REF.
          # Seed its metadata downloads before building this fresh checkout.
          if [ -n "${RIALTO_OCDM_REF:-}" ]; then
            mkdir -p tests/third-party/include tests/third-party/source
            curl --fail --show-error --location "https://raw.githubusercontent.com/rdkcentral/rialto-ocdm/$RIALTO_OCDM_REF/library/include/RialtoGStreamerEMEProtectionMetadata.h" -o tests/third-party/include/RialtoGStreamerEMEProtectionMetadata.h
            curl --fail --show-error --location "https://raw.githubusercontent.com/rdkcentral/rialto-ocdm/$RIALTO_OCDM_REF/library/source/RialtoGStreamerEMEProtectionMetadata.cpp" -o tests/third-party/source/RialtoGStreamerEMEProtectionMetadata.cpp
          fi
          python3 build_ut.py -xml -f -cov -b "$RIALTO_BUILD_REF"

      - name: Upload Target Commit Coverage Statistics
        if: ${{ github.event_name == 'pull_request' && (startsWith(github.base_ref, 'release/') || startsWith(github.base_ref, 'support/')) }}
        uses: actions/upload-artifact@v4
        with:
          name: baseline_coverage_report_stats
          path: coverage-baseline/build/coverage_statistics.txt
          if-no-files-found: error

      - name: Upload baseline logs on failure
        if: ${{ failure() && github.event_name == 'pull_request' && (startsWith(github.base_ref, 'release/') || startsWith(github.base_ref, 'support/')) }}
        uses: actions/upload-artifact@v4
        with:
          name: baseline_logs
          path: |
            coverage-baseline/gtest_result.log
            coverage-baseline/build/*gtest_result.xml

  checks-the-cov-report:
    name: Checks the Coverage Report
    if: ${{ always() && github.event_name == 'pull_request' }}
    permissions:
      contents: read
      actions: read
      issues: write
      pull-requests: write

    # Runs on ubuntu
    runs-on: ubuntu-24.04

    # Timeout after
    timeout-minutes: 2

    # # Define the dependencies on the previous coverage jobs
    needs: [build-test]
    
    steps:
      - name: Require successful coverage builds
        if: ${{ needs.build-test.result != 'success' }}
        run: |
          echo "PR or baseline coverage build did not succeed; coverage comparison cannot pass." >&2
          exit 1

      - name: Checkout repo
        uses: actions/checkout@v4
    
      # Download the current coverage statistics
      - name: Download Current Coverage Statistics
        uses: actions/download-artifact@v4
        with:
          name: coverage_report_stats
          path: build
        
      - name: Download Master Coverage Statistics
        if: ${{ github.base_ref == 'master' }}
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow_conclusion: success
          branch: master
          name: coverage_report_stats
          path: baseline_artifacts

      - name: Download Target Commit Coverage Statistics
        if: ${{ startsWith(github.base_ref, 'release/') || startsWith(github.base_ref, 'support/') }}
        uses: actions/download-artifact@v4
        with:
          name: baseline_coverage_report_stats
          path: baseline_artifacts
      
      # Run the process_coverage_stats script
      - name: Process Coverage Statistics
        id: compare-coverage
        run: python3 scripts/coverage/process_coverage_stats.py baseline_artifacts/coverage_statistics.txt build/coverage_statistics.txt
      
      # Create comment with coverage info
      - name: Create Coverage Comment
        if: ${{ (success() || failure()) && (steps.compare-coverage.outcome == 'success' || steps.compare-coverage.outcome == 'failure') && hashFiles('comparison_output.txt') != '' }}
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.pull_request.number }}
          body-path: comparison_output.txt
  