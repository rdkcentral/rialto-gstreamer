# This workflow builds and runs the rialto-gstreamer unittests. The workflow shall fail if any test fails
# and the results of the tests are checked and displayed in github. Logs are uploaded on failure.

name: build_ut

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "master" and "release/*" branches
  push:
    branches: ["master", "release/*"]
  pull_request:
    branches: ["master", "release/*"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This job sets up the repo with the dependancies then runs the tests
  build-test:
    name: Build and test build_ut

    # Runs on ubuntu
    runs-on: ubuntu-24.04

    # Timeout after
    timeout-minutes: 60

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - name: checkout repo
        uses: actions/checkout@v4

      # Check, from which rialto branch should we download headers
      - name: Check if rialto branch with the same name exists
        id: check-branch
        shell: bash
        run: |
          # Default to master for security
          branch="master"
          
          # For push events, check if branch exists in official rialto repo
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            current_branch="${{ github.ref_name }}"
            
            # Verify branch exists in official rdkcentral/rialto repository
            if git ls-remote --exit-code --heads "https://github.com/rdkcentral/rialto.git" "refs/heads/$current_branch" > /dev/null 2>&1; then
              branch="$current_branch"
              echo "✓ Found matching branch '$current_branch' in official rialto repo"
            else
              echo "⚠ Branch '$current_branch' not found in rialto repo, using master"
            fi
          fi
          
          # For pull requests, try to find matching branch in official repo
          # Priority: PR head branch name (if exists in official repo) > base branch > master
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            head_ref="${{ github.event.pull_request.head.ref }}"
            base_ref="${{ github.event.pull_request.base.ref }}"
            
            # Try PR head branch name (but only if it exists in OFFICIAL rdkcentral/rialto repo)
            # This is safe because we verify it exists in the official repo, not the fork
            if git ls-remote --exit-code --heads "https://github.com/rdkcentral/rialto.git" "refs/heads/$head_ref" > /dev/null 2>&1; then
              branch="$head_ref"
              echo "✓ Using PR head branch '$head_ref' from official rialto repo"
            # Try base branch
            elif git ls-remote --exit-code --heads "https://github.com/rdkcentral/rialto.git" "refs/heads/$base_ref" > /dev/null 2>&1; then
              branch="$base_ref"
              echo "✓ Using PR base branch '$base_ref' from official rialto repo"
            else
              # Fall back to master
              echo "⚠ Neither head nor base branch found in rialto repo, using master"
            fi
          fi
          
          echo "Using rialto branch: $branch"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      # Checkout rialto repository for header fallback (using validated branch only)
      - name: checkout rialto repo (for header dependencies)
        uses: actions/checkout@v4
        with:
          repository: rdkcentral/rialto
          path: rialto
          ref: ${{ steps.check-branch.outputs.branch }}

      # Verify rialto checkout and list header files for debugging
      - name: Verify rialto checkout
        run: |
          echo "=== Verifying rialto checkout ==="
          if [ -d "rialto" ]; then
            echo "✓ rialto directory exists"
            echo "Listing key directories:"
            ls -la rialto/ || true
            echo ""
            echo "ServerManager include files:"
            ls -la rialto/serverManager/public/include/ 2>/dev/null || echo "❌ serverManager/public/include/ not found"
            echo ""
            echo "Media include files:"
            ls -la rialto/media/public/include/ 2>/dev/null || echo "❌ media/public/include/ not found"
            echo ""
            echo "Common include files:"
            ls -la rialto/common/public/include/ 2>/dev/null || echo "❌ common/public/include/ not found"
          else
            echo "❌ rialto directory does NOT exist!"
            exit 1
          fi

      # Ensure Unix line endings for all text files (fix CRLF issues on Windows-checked-out repos)
      - name: Convert line endings to LF
        run: |
          find . -type f \( -name "*.sh" -o -name "*.py" -o -name "*.yml" -o -name "*.yaml" \) -print0 | xargs -0 sed -i 's/\r$//'
          git config core.safecrlf false

      # Setup github for python 3.8
      - name: setup python
        uses: actions/setup-python@v5
        with:
          python-version: 3.8

      # Setup gstreamer 1.0
      - name: Build gstreamer library
        run: |
          sudo apt-get update
          sudo apt-get install libunwind-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libgstreamer-plugins-bad1.0-dev gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-plugins-ugly gstreamer1.0-libav gstreamer1.0-tools gstreamer1.0-x gstreamer1.0-alsa gstreamer1.0-gl gstreamer1.0-gtk3 gstreamer1.0-qt5 gstreamer1.0-pulseaudio

      # Setup github for lcov 2.0
      - name: Build lcov library
        run: |
          sudo apt-get install libjson-perl libperlio-gzip-perl perl libgd-gd2-perl libcapture-tiny-perl libdatetime-perl
          wget https://github.com/linux-test-project/lcov/releases/download/v2.0/lcov-2.0.tar.gz
          tar -xf lcov-2.0.tar.gz
          cd lcov-2.0
          sudo make install

      # Run the build script
      - name: build_ut.py script
        run: |
              python build_ut.py -c -xml -f -cov -b ${{ steps.check-branch.outputs.branch }}

      # Process the test results
      - name: Check results
        uses: dorny/test-reporter@v1
        if: success() || failure()
        with:
          name: GTests
          path: build/*gtest_result.xml
          reporter: java-junit

      # Upload logs on failure
      - name: Upload logs
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: logs
          path: |
            gtest_result.log
            build/*gtest_result.xml

      # Upload coverage report on success
      - name: Upload Coverage Report
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: coverage_report
          path: build/gh_pages/coverage_report

      # Upload coverage statistics on success
      - name: Upload Coverage Statistics
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: coverage_report_stats
          path: build/coverage_statistics.txt

  checks-the-cov-report:
    name: Checks the Coverage Report

    # Runs on ubuntu
    runs-on: ubuntu-24.04

    # Timeout after
    timeout-minutes: 2

    # # Define the dependencies on the previous coverage jobs
    needs: [build-test]
    
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
    
      # Download the current coverage statistics
      - name: Download Current Coverage Statistics
        uses: actions/download-artifact@v4
        with:
          name: coverage_report_stats
          path: build
        
      # Download current master coverage statistics
      - name: Download Master Coverage Statistics
        uses: dawidd6/action-download-artifact@v6
        if: ${{ success() && github.event_name == 'pull_request' && github.base_ref == 'master' }}
        with:
          workflow_conclusion: success
          branch: master
          name: coverage_report_stats
          path: master_artifacts
      
      # Run the process_coverage_stats script
      - name: Process Coverage Statistics
        if: ${{ success() && github.event_name == 'pull_request' && github.base_ref == 'master' }}
        run: python scripts/coverage/process_coverage_stats.py ./master_artifacts/coverage_statistics.txt build/coverage_statistics.txt
      
      # Get process_coverage_stats script output
      - id: get-comment-body
        if: ${{ (success() || failure()) && github.ref != 'refs/heads/master' }}
        run: |
          body="$(cat comparison_output.txt)"
          body="${body//'%'/'%25'}"
          body="${body//$'\n'/'%0A'}"
          body="${body//$'\r'/'%0D'}"
          echo "::set-output name=body::$body"
      
      # Create comment with coverage info
      - name: Create Coverage Comment
        if: ${{ (success() || failure()) && github.ref != 'refs/heads/master' }}
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.pull_request.number }}
          body: ${{ steps.get-comment-body.outputs.body }}
  